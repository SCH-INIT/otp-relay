name: Deploy Portal UI

on:
  push:
    branches: [ portal ]
    paths:
      - "frontend/app.jsx"
      - "frontend/index.html"
      - "frontend/style.css"
      - "frontend/guide.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/deploy_portal_ui.py"
      - ".github/workflows/deploy-portal-ui.yml"
  workflow_dispatch:

jobs:
  deploy-portal-ui:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Use system Python
        run: python3 --version

      - name: Deploy UI files incrementally
        run: python3 scripts/deploy_portal_ui.py
