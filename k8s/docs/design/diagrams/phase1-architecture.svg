<svg width="100%" viewBox="0 0 680 860" role="img" xmlns="http://www.w3.org/2000/svg">
<title>OTP Relay Phase 1 architecture</title>
<desc>Three-node K3s cluster with Traefik ingress, otp-relay and otp-monitor pods sharing a PVC, MetalLB LoadBalancer, and iPhone SMS shortcut.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, sans-serif; }
    .th  { font-size: 14px; font-weight: 500; fill: #1F2937; }
    .ts  { font-size: 12px; font-weight: 400; fill: #4B5563; }

    .gray-bg   { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray-box  { fill: #D3D1C7; stroke: #5F5E5A; }
    .gray-txt  { fill: #2C2C2A; }
    .gray-sub  { fill: #444441; }

    .teal-bg   { fill: #E1F5EE; stroke: #0F6E56; }
    .teal-box  { fill: #9FE1CB; stroke: #0F6E56; }
    .teal-txt  { fill: #085041; }
    .teal-sub  { fill: #0F6E56; }

    .purple-bg  { fill: #EEEDFE; stroke: #534AB7; }
    .purple-box { fill: #AFA9EC; stroke: #534AB7; }
    .purple-txt { fill: #26215C; }
    .purple-sub { fill: #3C3489; }

    .amber-box { fill: #FAC775; stroke: #854F0B; }
    .amber-txt { fill: #412402; }
    .amber-sub { fill: #633806; }
  </style>
</defs>

<!-- ── External actors ─────────────────────────────────────────────────── -->
<rect class="gray-box" x="40" y="30" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-txt" x="100" y="52" text-anchor="middle" dominant-baseline="central">User</text>
<text class="ts gray-sub" x="100" y="70" text-anchor="middle" dominant-baseline="central">browser</text>

<rect class="gray-box" x="520" y="30" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-txt" x="580" y="52" text-anchor="middle" dominant-baseline="central">iPhone</text>
<text class="ts gray-sub" x="580" y="70" text-anchor="middle" dominant-baseline="central">SMS shortcut</text>

<line x1="100" y1="86" x2="100" y2="148" stroke="#9CA3AF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="100" y1="117" x2="270" y2="117" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 2" fill="none"/>
<line x1="580" y1="86" x2="580" y2="148" stroke="#9CA3AF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="580" y1="117" x2="410" y2="117" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 2" fill="none"/>
<text class="ts" x="190" y="112" text-anchor="middle" fill="#9CA3AF">HTTPS</text>
<text class="ts" x="492" y="112" text-anchor="middle" fill="#9CA3AF">HTTPS + X-Secret-Token</text>

<!-- ── K3s cluster boundary ────────────────────────────────────────────── -->
<rect x="20" y="140" width="640" height="590" rx="16" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="6 3"/>
<text x="40" y="164" style="font-family:system-ui,sans-serif;font-size:13px;font-weight:500;fill:#085041">K3s cluster — srvk3mst01 / srvk3wrk01 / srvk3wrk02</text>

<!-- ── MetalLB + Traefik ───────────────────────────────────────────────── -->
<rect class="teal-box" x="40" y="174" width="600" height="64" rx="10" stroke-width="0.5"/>
<text class="th teal-txt" x="340" y="198" text-anchor="middle" dominant-baseline="central">MetalLB — LoadBalancer IP (assigned from LAN pool)</text>
<text class="ts teal-sub" x="340" y="220" text-anchor="middle" dominant-baseline="central">Traefik ingress controller — TLS termination — routes to otp-relay service port 80</text>

<line x1="340" y1="238" x2="340" y2="272" stroke="#9CA3AF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="358" y="258" fill="#9CA3AF" dominant-baseline="central">HTTP :8000</text>

<!-- ── Namespace otp-relay ────────────────────────────────────────────── -->
<rect x="40" y="276" width="600" height="384" rx="12" fill="none" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 3"/>
<text style="font-family:system-ui,sans-serif;font-size:12px;font-weight:500;fill:#3C3489" x="60" y="298">namespace: otp-relay</text>

<!-- ── Pod: otp-relay ─────────────────────────────────────────────────── -->
<rect class="teal-bg" x="60" y="310" width="266" height="196" rx="10" stroke-width="0.5"/>
<text class="th teal-txt" x="193" y="332" text-anchor="middle" dominant-baseline="central">pod: otp-relay</text>

<rect class="teal-box" x="76" y="344" width="234" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-txt" x="193" y="366" text-anchor="middle" dominant-baseline="central">container: app</text>
<text class="ts teal-sub" x="193" y="384" text-anchor="middle" dominant-baseline="central">uvicorn · 1 worker · port 8000</text>

<rect class="gray-box" x="76" y="412" width="234" height="78" rx="8" stroke-width="0.5" stroke-dasharray="4 2"/>
<text class="th gray-txt" x="193" y="436" text-anchor="middle" dominant-baseline="central">in-memory state</text>
<text class="ts gray-sub" x="193" y="454" text-anchor="middle" dominant-baseline="central">claim_queue (deque)</text>
<text class="ts gray-sub" x="193" y="470" text-anchor="middle" dominant-baseline="central">pending_otps (dict)</text>

<!-- ── Pod: otp-monitor ───────────────────────────────────────────────── -->
<rect class="purple-bg" x="354" y="310" width="266" height="196" rx="10" stroke-width="0.5"/>
<text class="th purple-txt" x="487" y="332" text-anchor="middle" dominant-baseline="central">pod: otp-monitor</text>

<rect class="purple-box" x="370" y="344" width="234" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-txt" x="487" y="366" text-anchor="middle" dominant-baseline="central">container: monitor</text>
<text class="ts purple-sub" x="487" y="384" text-anchor="middle" dominant-baseline="central">arping · WhatsApp alerts</text>

<rect class="amber-box" x="370" y="412" width="234" height="34" rx="8" stroke-width="0.5"/>
<text class="th amber-txt" x="487" y="429" text-anchor="middle" dominant-baseline="central">CAP: NET_RAW</text>

<path d="M604 429 L640 429 L640 58 L642 58" stroke="#EF9F27" stroke-width="0.5" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow)"/>
<text style="font-family:system-ui,sans-serif;font-size:11px;fill:#BA7517" x="648" y="244">ARP</text>

<!-- ── Shared PVC ─────────────────────────────────────────────────────── -->
<rect class="gray-bg" x="156" y="530" width="368" height="100" rx="10" stroke-width="0.5"/>
<text class="th gray-txt" x="340" y="556" text-anchor="middle" dominant-baseline="central">PersistentVolumeClaim: otp-relay-data</text>
<text class="ts gray-sub" x="340" y="576" text-anchor="middle" dominant-baseline="central">data/users.xlsx · data/audit.log</text>
<text class="ts gray-sub" x="340" y="594" text-anchor="middle" dominant-baseline="central">mounted at /app/data in both pods</text>
<text class="ts gray-sub" x="340" y="612" text-anchor="middle" dominant-baseline="central">survives pod restarts · 1Gi</text>

<line x1="193" y1="506" x2="193" y2="528" stroke="#9CA3AF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="487" y1="506" x2="487" y2="528" stroke="#9CA3AF" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<!-- ── ConfigMap + Secret ─────────────────────────────────────────────── -->
<rect class="gray-box" x="60" y="652" width="272" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-txt" x="196" y="674" text-anchor="middle" dominant-baseline="central">ConfigMap: otp-relay-config</text>
<text class="ts gray-sub" x="196" y="692" text-anchor="middle" dominant-baseline="central">env vars for app + monitor</text>

<rect class="gray-box" x="348" y="652" width="272" height="56" rx="8" stroke-width="0.5"/>
<text class="th gray-txt" x="484" y="674" text-anchor="middle" dominant-baseline="central">Secret: otp-relay-secrets</text>
<text class="ts gray-sub" x="484" y="692" text-anchor="middle" dominant-baseline="central">SMS token · WhatsApp key + number</text>

<line x1="196" y1="652" x2="193" y2="510" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)"/>
<line x1="484" y1="652" x2="487" y2="510" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)"/>

<!-- ── Note ───────────────────────────────────────────────────────────── -->
<rect x="40" y="724" width="600" height="40" rx="8" fill="none" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="ts" x="340" y="748" text-anchor="middle" fill="#9CA3AF">in-memory state is lost on pod restart — accepted in Phase 1, fixed in Phase 2 with Redis</text>

</svg>
