apiVersion: apps/v1
kind: Deployment
metadata:
  name: otp-monitor
  namespace: otp-relay
  labels:
    app: otp-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otp-monitor
  template:
    metadata:
      labels:
        app: otp-monitor
    spec:
      # ── hostNetwork — required for arping ─────────────────────────────
      # The monitor must send ARP probes on the physical LAN to detect the
      # iPhone. Without hostNetwork, the pod only sees the cluster overlay
      # network and arping will never reach the iPhone's subnet.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Must match the app pod's nodeSelector — both share a ReadWriteOnce
      # PVC that is bound to a single node.
      nodeSelector:
        otp-relay/storage: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: monitor
          image: otp-monitor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otp-relay-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: otp-relay-secrets
                  key: TELEGRAM_CHAT_ID
          envFrom:
            - configMapRef:
                name: otp-relay-config
          # ── CAP_NET_RAW — required for arping ────────────────────────────
          # arping sends raw ARP packets which requires this capability.
          # We add only this capability and drop all others for least privilege.
          securityContext:
            capabilities:
              add: ["NET_RAW"]
              drop: ["ALL"]
          # ── Resource limits ──────────────────────────────────────────────
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # ── Volume mount — shares PVC with the app pod ───────────────────
          # The monitor reads and writes the audit log at /app/data/audit.log.
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otp-relay-data
