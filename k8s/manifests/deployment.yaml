apiVersion: apps/v1
kind: Deployment
metadata:
  name: otp-relay
  namespace: otp-relay
  labels:
    app: otp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otp-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: otp-relay
    spec:
      # ── Node pinning ──────────────────────────────────────────────────
      # The PVC uses ReadWriteOnce (local-path). Both the app and monitor
      # pods must land on the same node to share the volume. Pick a worker
      # node and label it:
      #   kubectl label node <node> otp-relay/storage=true
      nodeSelector:
        otp-relay/storage: "true"

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999

      containers:
        - name: app
          image: otp-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          # ── Environment: non-secret config from ConfigMap ──────────────────
          envFrom:
            - configMapRef:
                name: otp-relay-config

          # ── Environment: secrets ───────────────────────────────────────────
          env:
            - name: SMS_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otp-relay-secrets
                  key: SMS_SECRET_TOKEN
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otp-relay-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: otp-relay-secrets
                  key: TELEGRAM_CHAT_ID

          # ── Resource limits ────────────────────────────────────────────────
          # Memory: 512Mi limit. 256Mi was the original limit, but OOMKilled
          # events appeared every ~3 days under steady use — a slow leak we
          # have not yet found and fixed. 512Mi pushes the leak past most
          # restart cycles. Tracked as a known issue in docs/k8s-plan.md.
          # Steady-state usage is ~50Mi; if the leak is fixed, this limit
          # can be lowered.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ── Probes ─────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3

          # ── Volume mount ───────────────────────────────────────────────────
          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otp-relay-data
